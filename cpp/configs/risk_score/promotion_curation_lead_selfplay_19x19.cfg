# Quarantined original-model self-play for supplemental Lead-40/Lead-80 curation.
# This corpus must remain outside every shuffler and trainer input root.

# Logs and training-data files -------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 20
logToStdout = true

dataBoardLen = 19
maxDataQueueSize = 2000
maxRowsPerTrainFile = 20000
firstFileRandMinProp = 0.15

# Plain self-play with deliberately asymmetric search strength -----------------------------

initGamesWithPolicy = false
policyInitAreaProp = 0
startPosesPolicyInitAreaProp = 0
compensateAfterPolicyInitProb = 0
sidePositionProb = 0

earlyForkGameProb = 0
earlyForkGameExpectedMoveProp = 0
forkGameProb = 0
forkGameMinChoices = 1
earlyForkGameMaxChoices = 1
forkGameMaxChoices = 1
sekiForkHackProb = 0

cheapSearchProb = 0
cheapSearchVisits = 1
cheapSearchTargetWeight = 0

reduceVisits = false
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 1
reducedVisitsWeight = 1

policySurpriseDataWeight = 0
valueSurpriseDataWeight = 0
useReanalyze = false

# Every game gives one color a fixed 100x playout advantage without compensating komi.
# Full curation analysis, not this generation bias, determines the eventual lead label.
handicapAsymmetricPlayoutProb = 0
normalAsymmetricPlayoutProb = 1
minAsymmetricRatio = 100
maxAsymmetricRatio = 100
minAsymmetricCompensateKomiProb = 0

estimateLeadProb = 0
switchNetsMidGame = false
fancyKomiVarying = false

# Game execution --------------------------------------------------------------------------

numGameThreads = 500
maxMovesPerGame = 1600

# Fixed 19x19 Tromp-Taylor-like rules and 7.5 komi ---------------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiMean = 7.5
komiStdev = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
handicapProb = 0
handicapCompensateKomiProb = 0
forkCompensateKomiProb = 0
sgfCompensateKomiProb = 0
handicapKomiInterpZeroProb = 0
sgfKomiInterpZeroProb = 0
drawRandRadius = 0
noResultStdev = 0

# Powered utility -------------------------------------------------------------------------

useScoreMaximizingUtility = true
scorePower = 1.5
scoreScale = 20.0
winWeight = 4.0

# A 300-visit base keeps the disadvantaged side at six visits under the 100x
# ratio, above KataGo's hard five-visit floor. Every retained position is
# reanalyzed at the frozen policy's standard/powered 200/800/2000-visit tiers.

maxVisits = 300
numSearchThreads = 1

# Keep normal self-play root exploration -------------------------------------------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
rootNumSymmetriesToSample = 4

rootDesiredPerChildVisitsCoeff = 2
useLcbForSelection = true
lcbStdevs = 5
minVisitPropForLCB = 0.15
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
cpuctExploration = 1.05
cpuctExplorationLog = 0.28
fpuReductionMax = 0.2
rootFpuReductionMax = 0
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2
numVirtualLossesPerThread = 1

# Eight H100 inference workers. Curation owns the full host while training is gated. --------

nnMaxBatchSize = 192
nnCacheSizePowerOfTwo = 24
nnMutexPoolSizePowerOfTwo = 18
nnRandomize = true
numNNServerThreadsPerModel = 8

cudaDeviceToUseModel0Thread0 = 0
cudaDeviceToUseModel0Thread1 = 1
cudaDeviceToUseModel0Thread2 = 2
cudaDeviceToUseModel0Thread3 = 3
cudaDeviceToUseModel0Thread4 = 4
cudaDeviceToUseModel0Thread5 = 5
cudaDeviceToUseModel0Thread6 = 6
cudaDeviceToUseModel0Thread7 = 7

cudaUseFP16 = true
cudaUseNHWC = true
