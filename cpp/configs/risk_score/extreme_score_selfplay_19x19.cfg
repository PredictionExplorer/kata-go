# Focal expected-best-of-N self-play against a frozen opponent snapshot.
# Launch separate Black-focal and White-focal workers. Required overrides:
#   extremeCohortSize=N
#   extremeScoreGroupSize=N
#   extremeCohortFocalColor=B|W
#   expectedMaxFocalColor=B|W
#   cudaDeviceToUseModel0Thread0=GPU
# Use -models-dir for the evolving focal model and -opponent-models-dir for
# one immutable frozen league snapshot.

# Logs and training data ------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 20
logToStdout = true

dataBoardLen = 19
maxDataQueueSize = 2000
maxRowsPerTrainFile = 20000
firstFileRandMinProp = 0.15

# Cohort defaults. Production overrides advance N through 1,2,4,8. ------------------------

extremeCohortSize = 1
extremeScoreGroupSize = 1
extremeCohortFocalColor = B
expectedMaxFocalColor = B

# Plain stochastic self-play ---------------------------------------------------------------

initGamesWithPolicy = false
policyInitAreaProp = 0
startPosesPolicyInitAreaProp = 0
compensateAfterPolicyInitProb = 0
sidePositionProb = 0

earlyForkGameProb = 0
earlyForkGameExpectedMoveProp = 0
forkGameProb = 0
forkGameMinChoices = 1
earlyForkGameMaxChoices = 1
forkGameMaxChoices = 1
sekiForkHackProb = 0

cheapSearchProb = 0
cheapSearchVisits = 1
cheapSearchTargetWeight = 0

reduceVisits = false
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 1
reducedVisitsWeight = 1

policySurpriseDataWeight = 0
valueSurpriseDataWeight = 0
useReanalyze = false

handicapAsymmetricPlayoutProb = 0
normalAsymmetricPlayoutProb = 0
maxAsymmetricRatio = 1
minAsymmetricCompensateKomiProb = 0

estimateLeadProb = 0
switchNetsMidGame = false
fancyKomiVarying = false

# Game execution --------------------------------------------------------------------------

numGameThreads = 100
maxMovesPerGame = 1600

# Fixed 19x19 positional-area rules and 7.5 komi -----------------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiMean = 7.5
komiStdev = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
handicapProb = 0
handicapCompensateKomiProb = 0
forkCompensateKomiProb = 0
sgfCompensateKomiProb = 0
handicapKomiInterpZeroProb = 0
sgfKomiInterpZeroProb = 0
drawRandRadius = 0
noResultStdev = 0

# Expected-max actor objective. Every win/result utility is ignored. ----------------------

useScoreMaximizingUtility = false
useExpectedMaxScoreUtility = true
winWeight = 0
noResultUtilityForWhite = 0
policyOptimism = 0
rootPolicyOptimism = 0

# Full search on every move ---------------------------------------------------------------

maxVisits = 2000
numSearchThreads = 1

# The stochastic attempt policy is part of the fixed expected-max objective. --------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
rootNumSymmetriesToSample = 4

rootDesiredPerChildVisitsCoeff = 2
useLcbForSelection = false
lcbStdevs = 5
minVisitPropForLCB = 0.15
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
cpuctExploration = 1.05
cpuctExplorationLog = 0.28
fpuReductionMax = 0.2
rootFpuReductionMax = 0
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2
numVirtualLossesPerThread = 1

# One focal and one frozen-opponent evaluator share the worker's assigned GPU. -------------

nnMaxBatchSize = 192
nnCacheSizePowerOfTwo = 24
nnMutexPoolSizePowerOfTwo = 18
nnRandomize = false
numNNServerThreadsPerModel = 1

cudaUseFP16 = true
cudaUseNHWC = true
