# Deterministic expected-best-of-N focal-model match against a frozen opponent.
# The production Python runner overrides both model paths, the schedule/result
# paths, numGamesTotal, extremeScoreGroupSize=N, and expectedMaxFocalColor=B|W.

# Output and deterministic schedule -------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 20
logToStdout = true

deterministicScheduleFile = extreme_score_match_schedule.jsonl
matchResultJsonlFile = extreme_score_match_results.jsonl

# Bot roles -------------------------------------------------------------------------------

numBots = 2
botName0 = focal
botName1 = frozen-opponent

# nnModelFile0 and nnModelFile1 are intentionally supplied by the hash-bound runner.

# One deterministic game stream per process -----------------------------------------------

numGameThreads = 1
numSearchThreads0 = 1
numSearchThreads1 = 1
maxVisits = 2000
maxMovesPerGame = 1600
clearBotBeforeSearch = true

allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3
initGamesWithPolicy = false

# Fixed empty-board 19x19 positional-area games at 7.5 komi -------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiMean = 7.5
komiStdev = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
handicapProb = 0
handicapCompensateKomiProb = 0
forkCompensateKomiProb = 0
sgfCompensateKomiProb = 0
handicapKomiInterpZeroProb = 0
sgfKomiInterpZeroProb = 0
drawRandRadius = 0
noResultStdev = 0

# Expected-max focal objective. N and focal color are overridden for every cell. -----------

useScoreMaximizingUtility = false
useExpectedMaxScoreUtility = true
extremeScoreGroupSize = 1
expectedMaxFocalColor = B
winWeight = 0
noResultUtilityForWhite = 0
policyOptimism = 0
rootPolicyOptimism = 0

# Same stochastic attempt policy as extreme_score_selfplay_19x19.cfg ----------------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
rootNumSymmetriesToSample = 4

rootDesiredPerChildVisitsCoeff = 2
useLcbForSelection = false
lcbStdevs = 5
minVisitPropForLCB = 0.15
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
cpuctExploration = 1.05
cpuctExplorationLog = 0.28
fpuReductionMax = 0.2
rootFpuReductionMax = 0
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2
numVirtualLossesPerThread = 1

# One inference server thread for each of the two model files ------------------------------

nnMaxBatchSize = 192
nnCacheSizePowerOfTwo = 24
nnMutexPoolSizePowerOfTwo = 18
nnRandomize = false
numNNServerThreadsPerModel = 1

cudaUseFP16 = true
cudaUseNHWC = true
