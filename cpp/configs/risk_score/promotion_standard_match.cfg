# Deterministic candidate-vs-reference safety match using standard utility.
# Required per-run overrides:
#   nnModelFile0=/immutable/candidate/model.bin.gz
#   nnModelFile1=/immutable/reference/model.bin.gz
# Also override the schedule and output paths for every immutable shard.

# Output and schedule ---------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 20
logToStdout = true

deterministicScheduleFile = promotion_standard_schedule.jsonl
matchResultJsonlFile = promotion_standard_results.jsonl
matchMoveJsonlFile = promotion_standard_moves.jsonl

# Bots ------------------------------------------------------------------------------------

numBots = 2
botName0 = candidate
botName1 = reference

# nnModelFile0 and nnModelFile1 are intentionally absent. Supplying one shared
# nnModelFile is not valid for promotion evaluation.

useScoreMaximizingUtility0 = false
scorePower0 = 1.5
scoreScale0 = 20.0
winWeight0 = 4.0

useScoreMaximizingUtility1 = false
scorePower1 = 1.5
scoreScale1 = 20.0
winWeight1 = 4.0

# Deterministic match execution -----------------------------------------------------------

numGameThreads = 1
numSearchThreads0 = 1
numSearchThreads1 = 1
maxVisits = 800
maxMovesPerGame = 1200
clearBotBeforeSearch = true

allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3

initGamesWithPolicy = false

# Fixed Tromp-Taylor-like rules and komi --------------------------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiMean = 7.5
komiStdev = 0
handicapProb = 0
handicapCompensateKomiProb = 0
forkCompensateKomiProb = 0
sgfCompensateKomiProb = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
drawRandRadius = 0
noResultStdev = 0

# Deterministic move selection and inference ----------------------------------------------

chosenMoveTemperatureEarly = 0
chosenMoveTemperature = 0
rootNoiseEnabled = false
rootNumSymmetriesToSample = 1
useUncertainty = false
cpuctUtilityStdevScale = 0

nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = false
numNNServerThreadsPerModel = 1
