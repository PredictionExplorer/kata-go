# Deterministic batch analysis for promotion position-bank curation.
# Run with CUDA_VISIBLE_DEVICES set to the exclusively leased physical GPU.
# Per-query maxVisits and powered/standard utility settings are supplied by
# risk_score.curate_position_bank and are bound in its query manifest.

logToStderr = true
logSearchInfo = false
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
warnUnusedFields = true

reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 15
maxVisits = 2000
forDeterministicTesting = true

numAnalysisThreads = 32
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 64
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = false
cudaDeviceToUse = 0

rootNoiseEnabled = false
rootNumSymmetriesToSample = 1
useUncertainty = false
cpuctUtilityStdevScale = 0

useScoreMaximizingUtility = false
scorePower = 1.5
scoreScale = 20.0
winWeight = 4.0
