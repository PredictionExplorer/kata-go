# Lightweight self-play-only safety gate for margin-seeking checkpoints.
# Candidate acceptance is based on fresh candidate-versus-current-model games.
# No external SGFs or curated position bank are used.

# Logs ------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true

# Fixed safety match -----------------------------------------------------------------------

numGameThreads = 100
numGamesPerGating = 100
maxMovesPerGame = 1600

allowResignation = true
resignThreshold = -0.95
resignConsecTurns = 5

# Standard search is deliberately used here. Self-play uses powered score utility, while
# this gate only rejects candidates that have become poor conventional Go players.
useScoreMaximizingUtility = false
scorePower = 1.5
scoreScale = 20.0
winWeight = 4.0

# Fixed production rules ------------------------------------------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiAuto = false
komiMean = 7.5
komiStdev = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
handicapProb = 0
handicapCompensateKomiProb = 0
drawRandRadius = 0
noResultStdev = 0

# Cheap but meaningful safety search -------------------------------------------------------

maxVisits = 400
numSearchThreads = 1

# Stochastic fresh games avoid repeatedly testing one deterministic opening.
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
rootNumSymmetriesToSample = 4

rootDesiredPerChildVisitsCoeff = 2
useLcbForSelection = true
lcbStdevs = 5
minVisitPropForLCB = 0.15
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
cpuctExploration = 1.05
cpuctExplorationLog = 0.28
fpuReductionMax = 0.2
rootFpuReductionMax = 0
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2
numVirtualLossesPerThread = 1

# GPU 7 is exposed as logical device 0 by CUDA_VISIBLE_DEVICES=7. Both models share it.

nnMaxBatchSize = 192
nnCacheSizePowerOfTwo = 24
nnMutexPoolSizePowerOfTwo = 18
nnRandomize = true
numNNServerThreadsPerModel = 1

cudaDeviceToUseModel0Thread0 = 0
cudaDeviceToUseModel1Thread0 = 0

cudaUseFP16 = true
cudaUseNHWC = true
