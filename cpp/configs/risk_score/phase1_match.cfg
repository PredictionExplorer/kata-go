# Deterministic Phase 1 baseline-vs-powered-utility match template.
# Supply nnModelFile, deterministicScheduleFile, and output paths with
# -override-config when running on another machine.

# Output and schedule ---------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 20
logToStdout = true

deterministicScheduleFile = phase1_schedule.jsonl
matchResultJsonlFile = phase1_results.jsonl
matchMoveJsonlFile = phase1_moves.jsonl

# Bots ------------------------------------------------------------------------------------

numBots = 2
botName0 = baseline
botName1 = powered-utility

# Intentionally no nnModelFile. Use the same model for both bots via:
# -override-config "nnModelFile=/path/to/model.bin.gz"

useScoreMaximizingUtility0 = false
useScoreMaximizingUtility1 = true
scorePower1 = 1.5
scoreScale1 = 20.0
winWeight1 = 2.0

# Deterministic match execution -----------------------------------------------------------

numGameThreads = 1
numSearchThreads = 1
maxVisits = 800
maxMovesPerGame = 1200
clearBotBeforeSearch = true

allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3

initGamesWithPolicy = false

# Fixed Tromp-Taylor-like rules and komi --------------------------------------------------

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

bSizes = 19
bSizeRelProbs = 1
allowRectangleProb = 0

komiMean = 7.5
komiStdev = 0
handicapProb = 0
handicapCompensateKomiProb = 0
forkCompensateKomiProb = 0
sgfCompensateKomiProb = 0
komiBigStdevProb = 0
komiBiggerStdevProb = 0
drawRandRadius = 0
noResultStdev = 0

# Deterministic move selection and inference ----------------------------------------------

chosenMoveTemperatureEarly = 0
chosenMoveTemperature = 0
rootNoiseEnabled = false
rootNumSymmetriesToSample = 1
useUncertainty = false
cpuctUtilityStdevScale = 0

nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = false
numNNServerThreadsPerModel = 1
